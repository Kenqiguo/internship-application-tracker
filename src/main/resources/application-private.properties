server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h
spring.datasource.url=${TRACKER_DATABASE_URL}
spring.datasource.username=${TRACKER_DATABASE_USER}
spring.datasource.password=${TRACKER_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
# Neon suspends the database after 5 idle minutes: keep no idle connections so it can sleep,
# and recycle connections before the server would drop them.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000
app.mode=private
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=tracker
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:private-schema.sql
