server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h
spring.datasource.url=${TRACKER_DATABASE_URL}
spring.datasource.username=${TRACKER_DATABASE_USER}
spring.datasource.password=${TRACKER_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=tracker
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:private-schema.sql
